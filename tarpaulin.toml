# cargo-tarpaulin config for the S5 coverage gate (plans/01 S5, 07§1).
# Gate: >=80% line coverage on `rest`, `gateway`, `cache`.
#
# Local:
#   export PATH=/tmp/ctools/bin:$PATH CARGO_TARGET_DIR=$PWD/.tmp/target
#   cargo tarpaulin --packages rivulus-rest rivulus-gateway rivulus-cache \
#     --all-features --out Stdout \
#     --exclude-files 'crates/model/*' 'crates/common/*' 'crates/rivulus/*' \
#     'crates/standby/*' 'crates/interactions/*' 'crates/framework/*' 'crates/voice/*'
# CI: `coverage` job in .github/workflows/ci.yml (continue-on-error pre-1.0).
#
# MEASURED 2026-09-28 (local, cargo-llvm-cov 0.9.1 — cargo-tarpaulin
# uninstallable in this env: openssl-sys needs system headers or `make`,
# neither present and no package manager; see plans/DECISIONS.md):
#   cargo llvm-cov -p rivulus-rest -p rivulus-gateway -p rivulus-cache \
#     --all-features --summary-only --fail-under-lines 80 \
#     --ignore-filename-regex 'crates/(model|common|rivulus|standby|interactions|framework|voice)/'
# Result: exit 0 (--fail-under-lines 80 satisfied). Lines TOTAL 95.28%
# (3772/3959); per-package lines: cache 98.16%, gateway 94.27%, rest 93.51%.
# Denominator policy identical to the exclude-files above (other crates out,
# tests in). CI keeps the tarpaulin job for tool-fidelity.

all-features = true
packages = ["rivulus-rest", "rivulus-gateway", "rivulus-cache"]
exclude-files = ["examples/*", "benches/*", "bench/*", "tests/*", "xtask/*", "crates/model/*", "crates/common/*", "crates/rivulus/*", "crates/standby/*", "crates/interactions/*", "crates/framework/*", "crates/voice/*"]
fail-under = 80.0
out = ["Xml"]
