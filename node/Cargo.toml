[package]
name = "rivulus-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Node.js binding (napi-rs) over the rivulus core. Standalone crate: not a workspace member, builds on stable only."
repository = "https://github.com/rivulus/rivulus"

[lib]
crate-type = ["cdylib", "rlib"]
name = "rivulus_node"

[dependencies]
napi = { version = "=2.16.17", features = ["tokio_rt", "napi4", "dyn-symbols"] }
napi-derive = "=2.16.13"
rivulus = { version = "0.1.0", path = "../crates/rivulus" }
interactions = { version = "0.1.0", package = "rivulus-interactions", path = "../crates/interactions" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde_json = "1"
secrecy = "0.8"
futures = "0.3"
time = { version = "0.3", features = ["formatting"] }

[build-dependencies]
napi-build = "=2.2.4"

[dev-dependencies]
futures = "0.3"
tokio-tungstenite = "0.24"
tungstenite = "0.24"
