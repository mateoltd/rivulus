name: node
on: [push, pull_request]
jobs:
  node:
    strategy:
      matrix:
        node: ["20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm run check-contract
        working-directory: node
      - run: npm run smoke
        working-directory: node
      - run: cargo fmt --manifest-path node/Cargo.toml --check
      - run: cargo clippy --manifest-path node/Cargo.toml --all-features -- -D warnings
      - run: cargo test --manifest-path node/Cargo.toml
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --manifest-path node/Cargo.toml check
